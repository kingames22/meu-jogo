 oOpen(()=>{oSend({t:'resume',code:ONS.code,token:ONS.token})},()=>{ONS.rt=setTimeout(oRetry,2000)})}
function oStopRetry(){ONS.retry=0;clearTimeout(ONS.rt)}

// ---- sair / limpar (sempre chamado ao voltar ao menu) ----
function oLeave(){if(!ONL&&!ONS.ws&&!ONS.code&&!ONS.intent)return;
 if(ONS.snap&&(SV.c!==ONS.snap[0]||SV.g!==ONS.snap[1]||SV.p!==ONS.snap[2]||SV.sd!==ONS.snap[3]||SV.cc!==ONS.snap[4]||SV.mx!==ONS.snap[5]||JSON.stringify(SV.w)!==ONS.snap[6])){
  console.warn('[online] economia/progresso alterados durante o online — revertendo');SV.c=ONS.snap[0];SV.g=ONS.snap[1];SV.p=ONS.snap[2];SV.sd=ONS.snap[3];SV.cc=ONS.snap[4];SV.mx=ONS.snap[5];SV.w=JSON.parse(ONS.snap[6]);sv()}
 ONS.snap=null;ONS.intent=false;oStopRetry();clearInterval(ONS.hb);clearInterval(ONS.tick);const w=ONS.ws;ONS.ws=null;if(w){try{w.send(JSON.stringify({t:'leave'}))}catch(e){}try{w.close()}catch(e){}}
 ONS.code='';ONS.token='';ONS.room=null;ONS.live=false;ONS.view='';ONS.ended=false;ONL=false;document.body.classList.remove('on1');ONQ.length=0;oBanner('');shot=null}
$('onx').onclick=()=>{if(!ONS.live)return;const n=Date.now();if(n-ONS.xT<3000){oLeave();menu();return}ONS.xT=n;oBanner('TOQUE DE NOVO PARA SAIR (VOCÊ PERDE A PARTIDA)');setTimeout(()=>{if(!ONS.retry&&!ONS.oppDownUntil)oBanner('')},3000)};
function oAuto(){try{const q=new URLSearchParams(location.search).get('sala');if(q&&PZ&&PZ.name)setTimeout(()=>oJoinScreen(q),400)}catch(e){}}

menu();requestAnimationFrame(loop);zInit();oAuto();
</script></body></html>
